[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promo-radar"
version = "0.1.0"
description = "Agente autônomo e modular para monitoramento contínuo de preços e detecção de ofertas reais"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Humberto Fonseca" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "jinja2>=3.1.0",
    "google-adk>=2.8.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "diagnosis: testes de diagnostico com HTML real capturado",
]

[tool.setuptools.packages.find]
where = ["."]
