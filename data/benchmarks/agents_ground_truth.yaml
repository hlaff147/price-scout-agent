fake_discount_cases:
  - description: "Promoção legítima de Black Friday consistente com histórico"
    current_price: 2499.0
    original_price_announced: 2899.0
    historical_avg: 2790.0
    user_max_price: 3000.0
    expected_is_fake: false

  - description: "Metade do dobro: preço original anunciado inflado 50% acima da média histórica"
    current_price: 2699.0
    original_price_announced: 4500.0
    historical_avg: 2800.0
    user_max_price: 3000.0
    expected_is_fake: true

  - description: "Sem histórico prévio (Dia 1), mas preço 'De' excede 45% o teto do usuário"
    current_price: 2890.0
    original_price_announced: 4900.0
    historical_avg: null
    user_max_price: 3000.0
    expected_is_fake: true

  - description: "Desconto autêntico moderado sem inflação do preço original"
    current_price: 999.0
    original_price_announced: 1199.0
    historical_avg: 1150.0
    user_max_price: 1200.0
    expected_is_fake: false

  - description: "Inflação mascarada de smartwatch: anunciado De 2.200 por 950 com média de 1.050"
    current_price: 950.0
    original_price_announced: 2200.0
    historical_avg: 1050.0
    user_max_price: 1200.0
    expected_is_fake: true

deal_cases:
  - description: "Queda brusca abaixo do alvo e abaixo da mínima anterior"
    product_id: "test-phone"
    target_price: 2600.0
    max_price: 3000.0
    historical_prices: [2800.0, 2850.0, 2790.0, 2820.0, 2780.0]
    scraped_price: 2450.0
    expected_is_deal: true
    expected_motivo: "minimo_historico"

  - description: "Preço estável dentro da faixa normal sem desconto real"
    product_id: "test-phone"
