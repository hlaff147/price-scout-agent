name: CI Quality Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src scripts tests docker

      - name: Run Pytest Suite
        run: pytest -v tests/

      - name: Run ML & Agents Quality Gates Benchmark
        run: python scripts/evaluate_agents.py --json /tmp/ml_eval_ci.json
